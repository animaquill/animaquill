packages:
  - packages/*
minimumReleaseAgeExclude:
  - lucide-react@1.69.0
  - vite@8.3.6
allowBuilds:
  # drizzle-kit (packages/server, only for writing migrations) brings esbuild. Its install script
  # only checks the binary, which comes from its platform package anyway.
  esbuild: false
  # Only for pi's Google provider, which works without them.
  "@google/genai": false
  protobufjs: false
  # The PostgreSQL that comes with `npx animaquill` (oss/packages/local): its script only makes the
  # links between its libraries, which the launcher there makes itself (backend/postgres.ts).
  "@embedded-postgres/darwin-arm64": false
  "@embedded-postgres/darwin-x64": false
  "@embedded-postgres/linux-arm64": false
  "@embedded-postgres/linux-x64": false
  "@embedded-postgres/windows-x64": false
