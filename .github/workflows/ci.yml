name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Not in check: these measure time, which a busy machine gets wrong. See vitest.config.ts.
      - run: pnpm test:perf

  # The server's tests (packages/server) with what they need: a PostgreSQL, an object storage
  # (versitygw, with its data on tmpfs) and Git. Without them those tests skip, as in `check`.
  server:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.6-alpine3.23
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U test" --health-interval 2s --health-timeout 5s --health-retries 20
      objects:
        image: versity/versitygw:v1.11.0
        env:
          VGW_BACKEND: posix
          VGW_BACKEND_ARG: /data
          VGW_PORT: ":7070"
          VGW_HEALTH: /_/health
          VGW_QUIET: "true"
          ROOT_ACCESS_KEY: ci-access
          ROOT_SECRET_KEY: ci-secret-key
        ports: ["7070:7070"]
        options: --user 65534:65534 --tmpfs /data:size=256m,mode=0700,uid=65534,gid=65534 --health-cmd "wget -q -O /dev/null http://127.0.0.1:7070/_/health" --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      AQ_TEST_DATABASE: postgres://test:test@127.0.0.1:5432/test
      AQ_TEST_S3: http://127.0.0.1:7070
      AQ_TEST_S3_ACCESS_KEY: ci-access
      AQ_TEST_S3_SECRET_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The tests of saving to GitHub put what they wrote into a real repository and check it with
      # git fsck: without Git they fail (with CI set), they do not skip.
      - run: git --version
      - run: pnpm test:server

  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The container runs as root while GitHub gives it a home of another user, and Firefox does not
      # start as root in a home that is not root's (Playwright says to set HOME). The backend of the
      # tests runs as pwuser with a home of its own, see packages/local/e2e/backend-support.ts.
      - run: pnpm e2e
        env:
          HOME: /root
      # The traces of what failed, which a failure that does not come again needs to be understood.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: packages/*/test-results/
          if-no-files-found: ignore
          retention-days: 14
